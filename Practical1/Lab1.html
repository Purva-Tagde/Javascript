<!DOCTYPE html>
<html>
<body>

<script>
    function calculateAll(a, b) {
        var sum = a + b;
        var difference = a - b;
        var product = a * b;
        var quotient = a / b;

        document.write("The sum of " + a + " and " + b + " is: " + sum + "<br>");
        document.write("The difference of " + a + " and " + b + " is: " + difference + "<br>");
        document.write("The product of " + a + " and " + b + " is: " + product + "<br>");
        document.write("The division of " + a + " by " + b + " is: " + quotient + "<br>");
    }

    
    calculateAll(10, 2);
</script>
